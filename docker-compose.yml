services:
  postgres:
    image: postgres:16-alpine
    container_name: marsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marsa_user
      POSTGRES_PASSWORD: marsa_password
      POSTGRES_DB: marsa_dev
      TZ: Africa/Cairo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsa_user -d marsa_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marsa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
