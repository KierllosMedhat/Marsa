[project]
name = "marsa-backend"
version = "0.1.0"
description = "Backend scaffold for مرساة psychiatric clinic management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "pyotp>=2.9",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "celery>=5.4",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.5",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

