<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>عيادة مرساة — جاري التحويل</title>
  <script>
    // 1. Unregister all service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    // 2. Clear all browser caches for this origin
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    // 3. Clear localStorage / sessionStorage if any
    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (_) {}

    // 4. Redirect immediately to the public home page
    const targetUrl = window.location.pathname.startsWith('/public') || window.location.port === '8080' ? '/public/' : '/';
    window.location.replace(targetUrl);
  </script>
  <meta http-equiv="refresh" content="0; url=/public/">
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <h2>عيادة مرساة</h2>
  <p>تم نقل بوابة الاستقبال إلى تطبيق الأجهزة الذكية والتابلت. جاري تحويلك إلى الموقع الرئيسي...</p>
  <p><a href="/">اضغط هنا إذا لم يتم تحويلك تلقائياً</a></p>
</body>
</html>
